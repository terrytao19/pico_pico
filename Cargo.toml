[package]
name = "pico-pico"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section", "inline-asm"] }
cortex-m-rt = "0.7.3"
critical-section = "1.1.3"
defmt = "0.3.8"
defmt-rtt = "0.4.1"
embassy-embedded-hal = { version = "0.2.0", features = ["defmt"] }
embassy-executor = { version = "0.6.0", features = [
    # These tasks are tiny; the huge default arena was eating RAM the
    # 240x240x2 framebuffer needs. See src/main.rs LCD.init_with().
    "task-arena-size-16384",
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
    "integrated-timers",
] }
embassy-futures = { version = "0.1.1", features = ["defmt"] }
embassy-rp = { version = "0.2.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
] }
embassy-sync = { version = "0.6.0", features = ["defmt"] }
embassy-time = { version = "0.3.2", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

panic-probe = { version = "0.3.2", features = ["print-defmt"] }
portable-atomic = { version = "1.8.0", features = ["critical-section"] }
static_cell = "2.1.0"

# Graphics and screen driver.
embedded-graphics = "0.8.1"
tinybmp = "0.5"
embedded-graphics-framebuf = "*"
display-interface = "*"
gc9a01-rs = "0.4.2"

arrayvec = { version = "*", default-features = false }
tinyrand = "*"

ph-qmi8658 = "0.1"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp"] }